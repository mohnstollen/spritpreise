<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spritpreise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14181c">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f2f4f5;--fg:#14181c;--card:#fff;--mut:#5d6870;--line:#d9dfe3;--ink:#14181c;--amber:#ffb000;--good:#1f9d55;--bad:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0e1114;--fg:#e9edef;--card:#1a2025;--mut:#93a0a8;--line:#2b343b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;background:var(--ink);color:#fff}
.seg{display:flex;border:1px solid #3a444c;border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:#cfd6da;padding:8px 14px;font-weight:600}
.seg button.on{background:var(--amber);color:#14181c}
#cfg{background:none;border:0;color:#fff;font-size:22px;padding:6px 10px}
main{position:relative;flex:1;min-height:0}
main>section{position:absolute;inset:0}
#map{z-index:0}
#list,#favs{overflow:auto;padding:10px 12px 16px}
#msg{position:absolute;z-index:1100;top:56px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;max-width:90%;text-align:center}
#msg:empty{display:none}
#loc{position:absolute;z-index:1000;right:12px;bottom:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--amber);font-size:24px;box-shadow:0 2px 8px #0006}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--mut);font-weight:600;border-top:3px solid transparent}
nav button.on{color:var(--fg);border-top-color:var(--amber)}
.sortbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--mut)}
.sortbar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.sortbar button.on{background:var(--ink);color:var(--amber);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.leaflet-popup-content .card{border:0;padding:0;margin:0;background:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--fg)}
.r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.p{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.p sup{font-size:.55em}
.mut{color:var(--mut);font-size:14px}
.all{display:flex;gap:12px;margin:6px 0;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.all .sel{color:var(--fg);font-weight:700}
.act{display:flex;gap:8px;align-items:center}
.act button{border:1px solid var(--line);background:none;border-radius:8px;font-size:20px;line-height:1;padding:6px 10px}
.act a{background:var(--ink);color:var(--amber);text-decoration:none;font-weight:600;border-radius:8px;padding:8px 14px}
.pin{transform:translate(-50%,-100%);width:max-content;background:var(--ink);color:var(--amber);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px #0006}
.pin sup{font-size:.6em}
.pin.g{border-color:var(--good)}.pin.r{border-color:var(--bad)}
.empty{color:var(--mut);text-align:center;margin-top:40px}
dialog{border:0;border-radius:12px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:#0009}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-weight:600}
dialog input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:14px 0 0}
dialog menu button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px}
dialog menu #save{background:var(--ink);color:var(--amber);border-color:var(--ink);font-weight:600}
#sf{flex:1 1 100%;order:3;display:flex;gap:8px}
#sf input{flex:1;min-width:0;padding:9px 12px;border:1px solid #3a444c;border-radius:8px;background:#222a31;color:#fff}
#sf button{background:var(--amber);color:#14181c;border:0;border-radius:8px;padding:0 14px;font-weight:700}
#res{position:absolute;z-index:1200;top:8px;left:12px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px #0006;overflow:hidden}
#res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
#open{background:none;border:1px solid #3a444c;color:#cfd6da;border-radius:8px;padding:8px 12px;font-weight:600}
#open[aria-pressed=true]{background:var(--amber);color:#14181c;border-color:var(--amber)}
.act button.t{font-size:15px;font-weight:600;padding:8px 12px}
.grpbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.grpbar button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 12px}
.grpbar button.on{background:var(--ink);color:var(--amber);border-color:var(--ink)}
.mv{display:flex;gap:8px;align-items:center;margin-top:8px}
.mv button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px}
.mv select{flex:1;min-width:0;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#views{position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;pointer-events:none;scrollbar-width:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#views::-webkit-scrollbar{display:none}
#views button{pointer-events:auto;flex:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-weight:600;box-shadow:0 1px 4px #0004}
#views button[data-vadd]{color:var(--mut)}
dialog select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.sortbar{flex-wrap:wrap}
#stand{margin-left:auto;font-size:14px}
.sv{margin-top:6px;font-size:14px;font-weight:600}
.sv.g{color:var(--good)}.sv.r{color:var(--bad)}
.two{display:flex;gap:10px;margin-top:12px}
.two label{flex:1;min-width:0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="seg" id="fuel" role="group" aria-label="Spritsorte">
    <button data-f="e5">E5</button><button data-f="e10">E10</button><button data-f="diesel">Diesel</button>
  </div>
  <button id="open" aria-pressed="false">Offen</button>
  <button id="cfg" aria-label="Einstellungen">⚙</button>
  <form id="sf" role="search"><input id="q" type="search" placeholder="Ort oder PLZ suchen" aria-label="Ort oder PLZ suchen" autocomplete="off"><button>Suchen</button></form>
</header>
<main>
  <div id="msg" role="status"></div>
  <div id="res" hidden></div>
  <div id="views"></div>
  <section id="map"><button id="loc" aria-label="Mein Standort">◎</button></section>
  <section id="list" hidden>
    <div class="sortbar">Sortieren:
      <button data-s="dist">Entfernung</button><button data-s="price">Preis</button><button data-s="save" id="ssave">Ersparnis</button>
      <span id="stand"></span>
    </div>
    <div id="items"></div>
  </section>
  <section id="favs" hidden></section>
</main>
<nav>
  <button data-v="map" class="on">Karte</button><button data-v="list">Liste</button><button data-v="favs">Favoriten</button>
</nav>
<dialog id="dlg">
  <form method="dialog">
    <h3>Einstellungen</h3>
    <label>Tankerkönig API-Key
      <input id="key" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </label>
    <label style="margin-top:12px">Startansicht
      <select id="start"></select>
    </label>
    <div class="two">
      <label>Tankmenge (l)<input id="lit" inputmode="decimal" autocomplete="off" placeholder="40"></label>
      <label>Verbrauch (l/100 km)<input id="cons" inputmode="decimal" autocomplete="off" placeholder="7"></label>
    </div>
    <p class="mut">Für den Umwegrechner in der Liste. Leer lassen schaltet ihn ab.</p>
    <p class="mut">Den kostenlosen Key gibt es auf creativecommons.tankerkoenig.de. Er wird nur lokal in diesem Browser gespeichert. Preisdaten: Tankerkönig.de (CC BY 4.0).</p>
    <menu><button value="cancel">Abbrechen</button><button id="save" value="ok">Speichern</button></menu>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={key:LS.get('key',''),fuel:LS.get('fuel','e5'),sort:LS.get('sort','dist'),favs:LS.get('favs',{}),fp:{},fpT:0,wait:0,open:LS.get('open',false),grp:'all',groups:LS.get('groups',[{id:'default',name:'Allgemein'}]),order:[],views:LS.get('views',[]),lit:LS.get('lit',40),cons:LS.get('cons',7),stations:[],me:null,view:'map'};
const FN={e5:'E5',e10:'E10',diesel:'Diesel'};
const API='https://creativecommons.tankerkoenig.de/json/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>typeof v==='number'?v:null;
const fmt=p=>{if(p==null)return '–';const t=p.toFixed(3);return t.slice(0,-1).replace('.',',')+'<sup>'+t.slice(-1)+'</sup>'};
const dist=(a,b)=>{const r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const prOf=s=>({e5:n(s.e5),e10:n(s.e10),diesel:n(s.diesel),open:s.isOpen!==false});
const vis=s=>!S.open||s.isOpen!==false;
const addr=s=>`${s.street||''} ${s.houseNumber||''}, ${s.postCode||''} ${s.place||''}`.replace(/\s+/g,' ').trim();
const hhmm=ms=>new Date(ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const msg=t=>{$('#msg').textContent=t||''};
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return x>0?x:0};
const eur=x=>Math.abs(x).toFixed(2).replace('.',',')+' €';

/* Karte */
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([51.16,10.45],6);
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · Preise: Tankerkönig.de (CC BY 4.0)'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let meMarker,pinMarker,tmr,lastQ=null,reqN=0;
const ref=()=>S.pin||S.me||[map.getCenter().lat,map.getCenter().lng];

function locate(){
  if(!navigator.geolocation)return msg('Standort wird nicht unterstützt');
  navigator.geolocation.getCurrentPosition(p=>{
    S.me=[p.coords.latitude,p.coords.longitude];S.pin=null;pinMarker?.remove();
    meMarker?.remove();
    meMarker=L.circleMarker(S.me,{radius:8,color:'#fff',weight:3,fillColor:'#2f7bf5',fillOpacity:1}).addTo(map);
    map.setView(S.me,13);
  },()=>msg('Standort nicht verfügbar. Bitte Freigabe prüfen.'),{enableHighAccuracy:true,timeout:10000});
}

async function load(force){
  if(!S.key)return msg('Kein API-Key. Bitte unter ⚙ eintragen.');
  if(map.getZoom()<11)return msg('Näher heranzoomen, um Preise zu laden');
  if(!force&&Date.now()<S.wait)return msg('Abfragen pausiert bis '+hhmm(S.wait)+' Uhr');
  const c=map.getCenter(),ne=map.getBounds().getNorthEast();
  const rad=Math.min(25,Math.max(1,dist([c.lat,c.lng],[ne.lat,ne.lng])));
  if(!force&&lastQ&&Date.now()-lastQ.t<300000&&dist([c.lat,c.lng],lastQ.c)<lastQ.rad*0.3&&rad<=lastQ.rad*1.25)return;
  const q=++reqN;
  try{
    msg('Lade Preise …');
    const r=await (await fetch(`${API}list.php?lat=${c.lat}&lng=${c.lng}&rad=${rad.toFixed(1)}&sort=dist&type=all&apikey=${encodeURIComponent(S.key)}`)).json();
    if(q!==reqN)return;
    if(!r.ok)throw new Error(r.message||'API-Fehler');
    S.stations=r.stations||[];lastQ={c:[c.lat,c.lng],rad,t:Date.now()};msg('');
    pins();if(S.view==='list')list();
  }catch(e){
    if(q!==reqN)return;
    S.wait=Date.now()+120000;
    msg((e instanceof TypeError?'Keine Antwort von Tankerkönig (evtl. Abfrage-Limit)':'Fehler: '+e.message)+'. Pause bis '+hhmm(S.wait)+' Uhr');
  }
}

function card(s,pr,d,extra=''){
  const a=`${s.street||''} ${s.houseNumber||''}, ${s.postCode||''} ${s.place||''}`.replace(/\s+/g,' ').trim();
  const nav='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a);
  const all=['e5','e10','diesel'].map(k=>`<span class="${k===S.fuel?'sel':''}">${FN[k]} ${fmt(pr[k])}</span>`).join('');
  return `<div class="card"><div class="r1"><b>${esc(s.brand||s.name)}</b><span class="p">${fmt(pr[S.fuel])}</span></div>
  <div class="mut">${esc(s.brand&&s.name!==s.brand?s.name+', ':'')}${esc(a)}${d!=null?' · '+d.toFixed(1).replace('.',',')+' km':''}${pr.open===false?' · geschlossen':''}</div>
  <div class="all">${all}</div>
  <div class="act"><button data-fav="${esc(s.id)}" aria-label="Favorit umschalten">${S.favs[s.id]?'★':'☆'}</button><a href="${nav}" target="_blank" rel="noopener">Navigation</a><button class="t" data-share="${esc(s.id)}">Teilen</button></div>${extra}</div>`;
}

function pins(){
  layer.clearLayers();
  const vs=S.stations.filter(vis);
  const v=vs.map(s=>n(s[S.fuel])).filter(x=>x!=null).sort((a,b)=>a-b);
  const lo=v[Math.floor(v.length/3)],hi=v[Math.floor(v.length*2/3)];
  vs.forEach(s=>{
    const p=prOf(s),x=p[S.fuel],c=x==null?'':x<=lo?'g':x>=hi?'r':'';
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="pin ${c}">${fmt(x)}</div>`})})
      .bindPopup(card(s,p,null,lastQ?`<div class="mut" style="margin-top:6px">Stand ${hhmm(lastQ.t)} Uhr</div>`:''),{minWidth:250}).addTo(layer);
  });
}

/* Umwegrechner: Kosten = Preis × (Tankmenge + Sprit für Hin- und Rückweg).
   Luftlinie × 1,3 als grobe Schätzung der Straßenentfernung. Vergleich mit der nächsten Tankstelle. */
const calcOn=()=>S.lit>0&&S.cons>0;
const cost=o=>o.pr[S.fuel]*(S.lit+2*1.3*o.d*S.cons/100);
function list(){
  const r=ref(),calc=calcOn(),srt=S.sort==='save'&&!calc?'price':S.sort;
  const a=S.stations.filter(vis).map(s=>({s,d:dist(r,[s.lat,s.lng]),pr:prOf(s)}));
  const base=a.filter(o=>o.pr[S.fuel]!=null).reduce((m,o)=>!m||o.d<m.d?o:m,null);
  if(calc)a.forEach(o=>{if(o.pr[S.fuel]!=null)o.c=cost(o)});
  a.sort(srt==='dist'?(x,y)=>x.d-y.d:srt==='save'?(x,y)=>(x.c??1e9)-(y.c??1e9)||x.d-y.d:(x,y)=>(x.pr[S.fuel]??99)-(y.pr[S.fuel]??99)||x.d-y.d);
  const sv=o=>{
    if(!calc||!base||o.c==null)return '';
    if(o===base)return '<div class="sv mut">Nächste Tankstelle (Vergleichswert)</div>';
    const x=base.c-o.c;
    return Math.abs(x)<0.005?'<div class="sv mut">Kostet genauso viel wie die nächste</div>':`<div class="sv ${x>0?'g':'r'}">${eur(x)} ${x>0?'günstiger':'teurer'} als die nächste, inkl. Umweg</div>`;
  };
  $('#items').innerHTML=a.map(o=>card(o.s,o.pr,o.d,sv(o))).join('')||'<p class="empty">Keine Tankstellen geladen. Wähle auf der Karte einen Ausschnitt mit Zoomstufe 11 oder näher.</p>';
  $('#ssave').hidden=!calc;
  $('#stand').textContent=lastQ&&S.stations.length?'Stand '+hhmm(lastQ.t)+' Uhr':'';
  $$('.sortbar button').forEach(b=>b.classList.toggle('on',b.dataset.s===srt));
}

function gOf(id){return S.groups.some(g=>g.id===S.favs[id].g)?S.favs[id].g:'default'}
function syncOrder(){S.order=LS.get('order',[]).filter(id=>S.favs[id]);for(const id in S.favs)if(!S.order.includes(id))S.order.push(id)}
function saveFavs(){LS.set('favs',S.favs);LS.set('order',S.order);LS.set('groups',S.groups)}
function visFavs(){return S.order.filter(id=>S.grp==='all'||gOf(id)===S.grp)}
function drawFavs(){
  const r=ref();
  const chips=[{id:'all',name:'Alle'},...S.groups].map(g=>`<button data-g="${esc(g.id)}" class="${g.id===S.grp?'on':''}">${esc(g.name)}</button>`).join('');
  const tools=S.grp!=='all'&&S.grp!=='default'?'<button data-gact="ren">Umbenennen</button><button data-gact="del">Gruppe löschen</button>':'';
  const ids=visFavs().filter(id=>!S.open||(S.fp[id]||{}).open!==false);
  const opts=id=>S.groups.map(g=>`<option value="${esc(g.id)}"${g.id===gOf(id)?' selected':''}>${esc(g.name)}</option>`).join('');
  $('#favs').innerHTML=`<div class="grpbar">${chips}<button data-gact="add">＋ Gruppe</button>${tools}</div>`+(S.fpT?`<p class="mut" style="margin:0 0 8px">Stand ${hhmm(S.fpT)} Uhr</p>`:'')+
    (ids.length?ids.map(id=>{const s=S.favs[id];return card(s,S.fp[id]||{},dist(r,[s.lat,s.lng]),`<div class="mv"><button data-mv="-1" data-id="${esc(id)}" aria-label="Nach oben">▲</button><button data-mv="1" data-id="${esc(id)}" aria-label="Nach unten">▼</button><select data-sel="${esc(id)}" aria-label="Gruppe">${opts(id)}</select></div>`)}).join(''):'<p class="empty">Keine Favoriten in dieser Ansicht. Tippe bei einer Tankstelle auf ☆.</p>');
}
async function favs(){
  drawFavs();
  const ids=Object.keys(S.favs);
  if(!ids.length)return;
  if(!S.key)return msg('Kein API-Key. Bitte unter ⚙ eintragen.');
  if(!ids.some(id=>!S.fp[id])&&Date.now()-S.fpT<120000)return;
  try{
    for(let i=0;i<ids.length;i+=10){
      const r=await (await fetch(`${API}prices.php?ids=${ids.slice(i,i+10).join(',')}&apikey=${encodeURIComponent(S.key)}`)).json();
      if(!r.ok)throw new Error(r.message||'API-Fehler');
      for(const id in r.prices){const p=r.prices[id];S.fp[id]={e5:n(p.e5),e10:n(p.e10),diesel:n(p.diesel),open:p.status!=='closed'}}
    }
    S.fpT=Date.now();drawFavs();
  }catch(e){$('#favs').insertAdjacentHTML('afterbegin',`<p class="empty">Fehler: ${esc(e.message||'Netzwerk')}</p>`)}
}

function show(v){
  S.view=v;
  for(const k of['map','list','favs'])$('#'+k).hidden=k!==v;
  $('#views').hidden=v!=='map';
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='map')map.invalidateSize();
  if(v==='list')list();
  if(v==='favs')favs();
}

function setFuel(f){
  S.fuel=f;LS.set('fuel',f);
  $$('#fuel button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  pins();if(S.view==='list')list();if(S.view==='favs')favs();
}

function openSettings(){
  const d=$('#dlg');if(d.open)return;
  $('#key').value=S.key;
  $('#lit').value=S.lit?String(S.lit).replace('.',','):'';
  $('#cons').value=S.cons?String(S.cons).replace('.',','):'';
  const cur=LS.get('start','');
  $('#start').innerHTML='<option value="">Mein Standort</option>'+S.views.map(v=>`<option value="${esc(v.id)}"${v.id===cur?' selected':''}>${esc(v.name)}</option>`).join('');
  d.showModal();
}

/* Events */
map.on('moveend',()=>{clearTimeout(tmr);tmr=setTimeout(load,1500)});
$('#loc').onclick=locate;
$('#cfg').onclick=openSettings;
$('#dlg').addEventListener('close',e=>{if(e.target.returnValue==='ok'){S.key=$('#key').value.trim();LS.set('key',S.key);LS.set('start',$('#start').value);
  S.lit=num($('#lit').value);S.cons=num($('#cons').value);LS.set('lit',S.lit);LS.set('cons',S.cons);
  msg('');if(S.view==='list')list();load(true)}});
/* Nach Rückkehr in die App veraltete Preise nachladen */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(S.view==='favs')favs();
  else if(lastQ&&Date.now()-lastQ.t>=300000)load();
});
$('#fuel').onclick=e=>{const b=e.target.closest('[data-f]');if(b)setFuel(b.dataset.f)};
$('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b)show(b.dataset.v)};
$('.sortbar').onclick=e=>{const b=e.target.closest('[data-s]');if(b){S.sort=b.dataset.s;LS.set('sort',S.sort);list()}};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fav]');if(!b)return;
  const id=b.dataset.fav,s=S.stations.find(x=>x.id===id)||S.favs[id];if(!s)return;
  if(S.favs[id]){delete S.favs[id];S.order=S.order.filter(x=>x!==id)}
  else{const{name,brand,street,houseNumber,postCode,place,lat,lng}=s;S.favs[id]={id,name,brand,street,houseNumber,postCode,place,lat,lng,g:'default'};S.order.push(id)}
  saveFavs();
  $$(`[data-fav="${CSS.escape(id)}"]`).forEach(x=>x.textContent=S.favs[id]?'★':'☆');
  if(S.view==='favs')favs();
});

/* Teilen, Filter, Favoritengruppen */
function syncOpen(){$('#open').setAttribute('aria-pressed',S.open)}
$('#open').onclick=()=>{S.open=!S.open;LS.set('open',S.open);syncOpen();pins();if(S.view==='list')list();if(S.view==='favs')favs()};
async function share(id){
  const st=S.stations.find(x=>x.id===id),s=st||S.favs[id];if(!s)return;
  const p=(st?prOf(st):S.fp[id]||{})[S.fuel];
  const link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+', '+addr(s));
  const text=`${s.brand||s.name}, ${s.place||''} – ${p==null?'kein Preis':p.toFixed(3).replace('.',',')+' €'} (${FN[S.fuel]}) – ${link}`;
  try{
    if(navigator.share)await navigator.share({text});
    else{await navigator.clipboard.writeText(text);msg('In die Zwischenablage kopiert');setTimeout(()=>msg(''),2000)}
  }catch{}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-share],[data-mv],[data-g],[data-gact]');if(!t)return;
  const d=t.dataset;
  if(d.share)return share(d.share);
  if(d.mv){
    const v=visFavs(),i=v.indexOf(d.id),j=i+ +d.mv;if(i<0||j<0||j>=v.length)return;
    const a=S.order.indexOf(v[i]),b=S.order.indexOf(v[j]);[S.order[a],S.order[b]]=[S.order[b],S.order[a]];
    saveFavs();return drawFavs();
  }
  if(d.g){S.grp=d.g;return drawFavs()}
  const g=S.groups.find(x=>x.id===S.grp);
  if(d.gact==='add'){const nm=(prompt('Name der neuen Gruppe')||'').trim();if(!nm)return;const id='g'+Date.now();S.groups.push({id,name:nm});S.grp=id}
  else if(d.gact==='ren'){const nm=(prompt('Neuer Name',g.name)||'').trim();if(!nm)return;g.name=nm}
  else if(d.gact==='del'){
    if(!confirm(`Gruppe „${g.name}“ löschen? Die Favoriten wandern nach „Allgemein“.`))return;
    S.groups=S.groups.filter(x=>x!==g);for(const id in S.favs)if(S.favs[id].g===g.id)S.favs[id].g='default';S.grp='all';
  }
  saveFavs();drawFavs();
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-sel]');if(!s)return;S.favs[s.dataset.sel].g=s.value;saveFavs();drawFavs()});

/* Gespeicherte Kartenausschnitte */
function drawViews(){
  $('#views').innerHTML='<button data-vadd>＋ Ausschnitt</button>'+S.views.map(v=>`<button data-view="${esc(v.id)}">${esc(v.name)}</button>`).join('');
}
function openView(v){
  S.pin=[v.lat,v.lng];pinMarker?.remove();
  map.setView([v.lat,v.lng],v.z,{animate:false});
  clearTimeout(tmr);load();
}
function saveView(){
  const nm=(prompt('Name für diesen Kartenausschnitt')||'').trim();if(!nm)return;
  const c=map.getCenter();
  S.views.push({id:'v'+Date.now(),name:nm,lat:c.lat,lng:c.lng,z:map.getZoom()});
  LS.set('views',S.views);drawViews();
  msg('Gespeichert. Zum Umbenennen oder Löschen lange drücken.');setTimeout(()=>msg(''),3500);
}
function editView(id){
  const v=S.views.find(x=>x.id===id);if(!v)return;
  const nm=prompt('Neuer Name (leer lassen zum Löschen)',v.name);if(nm===null)return;
  const s=nm.trim();
  if(!s){if(confirm(`Ausschnitt „${v.name}“ löschen?`)){S.views=S.views.filter(x=>x!==v);if(LS.get('start','')===id)LS.set('start','')}}
  else v.name=s;
  LS.set('views',S.views);drawViews();
}
let lpT,lp=false;
const vb=$('#views');
vb.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-view]');if(!b)return;lp=false;lpT=setTimeout(()=>{lp=true;editView(b.dataset.view)},600)});
['pointerup','pointercancel'].forEach(ev=>vb.addEventListener(ev,()=>clearTimeout(lpT)));
vb.addEventListener('contextmenu',e=>e.preventDefault());
vb.onclick=e=>{
  if(lp){lp=false;return}
  if(e.target.closest('[data-vadd]'))return saveView();
  const b=e.target.closest('[data-view]');if(!b)return;
  const v=S.views.find(x=>x.id===b.dataset.view);if(v)openView(v);
};

/* Ortssuche (Nominatim, nur bei Absenden, keine Autovervollständigung) */
function go(x){
  $('#res').hidden=true;S.pin=[+x.lat,+x.lon];
  pinMarker?.remove();
  pinMarker=L.circleMarker(S.pin,{radius:8,color:'#fff',weight:3,fillColor:'#ffb000',fillOpacity:1}).addTo(map);
  show('map');map.setView(S.pin,13,{animate:false});$('#q').blur();
}
$('#sf').onsubmit=async e=>{
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;
  $('#res').hidden=true;
  try{
    msg('Suche …');
    const r=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=de&limit=5&accept-language=de&q='+encodeURIComponent(q))).json();
    msg('');
    if(!r.length)return msg('Nichts gefunden');
    if(r.length===1)return go(r[0]);
    S.res=r;
    $('#res').innerHTML=r.map((x,i)=>`<button data-i="${i}">${esc(x.display_name.split(',').slice(0,3).join(','))}</button>`).join('');
    $('#res').hidden=false;
  }catch{msg('Suche fehlgeschlagen')}
};
$('#res').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(S.res[b.dataset.i])};

syncOrder();syncOpen();
setFuel(S.fuel);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
drawViews();
if(!S.key)openSettings();
const sv=S.views.find(v=>v.id===LS.get('start',''));
if(sv)openView(sv);else locate();
</script>
</body>
</html>
